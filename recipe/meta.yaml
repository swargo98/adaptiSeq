{% set name = "adaptiseq" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/adaptiseq-{{ version }}.tar.gz
  sha256: f8a20c08fe86d08c38fc5635752edb00b5363a5273ae8752a387015cefe4584d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - adaptiseq = adaptiseq.cli:main
  run_exports:
    - {{ pin_subpackage('adaptiseq', max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77.0
  run:
    - python >=3.10
    - aiohttp >=3.8
    - aioftp >=0.21
    - numpy >=1.21
    # External tools adaptiSeq shells out to (same set as iSeq, plus md5sum,
    # which macOS does not ship). The CLI preflight is needs-based, but the
    # package installs them all so every mode works out of the box.
    - wget
    - axel
    - pigz
    - coreutils
    - sra-tools >=2.11.0
    - aspera-cli 4.14.0.*

test:
  imports:
    - adaptiseq
    - adaptiseq.engine
  source_files:
    - tests
  commands:
    - adaptiseq --version
    - adaptiseq --help
    - python -m adaptiseq --version
    - pip check
    # The offline suite shipped in the sdist (local fixtures and servers only).
    - ADAPTISEQ_NO_NETWORK=1 python -m pytest -q -p no:cacheprovider tests
  requires:
    - pip
    - pytest >=7.0

about:
  home: https://github.com/swargo98/adaptiSeq
  summary: "Fast, importable downloader for public sequencing data (GSA/SRA/ENA/DDBJ/GEO) with a segmented, resumable, self-tuning batch engine."
  description: |
    adaptiSeq downloads sequencing data and metadata from GSA, SRA, ENA, DDBJ
    and GEO. It is a tested Python reimplementation of iSeq, extended with
    batch-parallel download of accession lists, a segmented and resumable
    HTTP(S)/FTP engine, adaptive concurrency, adaptive parallel Aspera, and an
    importable Python API.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/swargo98/adaptiSeq
  doc_url: https://swargo98.github.io/adaptiSeq/

extra:
  recipe-maintainers:
    - swargo98

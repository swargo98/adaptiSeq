# Development environment for adaptiSeq (editable install of this checkout).
#
# Users should install the packaged release instead:
#   conda install -c conda-forge -c bioconda adaptiseq
# (recipe: recipe/meta.yaml). Run this file from the repository root:
#   conda env create -f environment.yml
#
# External CLI tools (wget, axel, pigz, coreutils for md5sum, aspera-cli for
# ascp, sra-tools) plus the Python dependencies: aiohttp + aioftp (segmented
# HTTP(S)/FTP engine) and numpy (the gradient adaptive controller). Metadata
# bytes are pulled by `wget` (shelled out), so `requests` is NOT required.
name: adaptiseq
channels:
  - conda-forge
  - bioconda
dependencies:
  # external download/convert tools (same set as recipe/meta.yaml)
  - wget
  - axel
  - pigz
  - coreutils
  - aspera-cli 4.14.0.*
  - sra-tools >=2.11.0
  # Python runtime (matches requires-python in pyproject.toml)
  - python >=3.10
  - pip
  - setuptools >=77.0
  - aiohttp >=3.8
  - aioftp >=0.21
  - numpy >=1.21
  # development only
  - pytest >=7.0
  - pip:
      - -e .
